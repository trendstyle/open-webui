[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pureib"
version = "0.1.0"
description = "HTTP and WebSocket over native InfiniBand (ibverbs + rdma_cm), without IPoIB or TCP"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
aiohttp = ["aiohttp==3.14.5"]
uvicorn = ["uvicorn>=0.34.0"]
test = ["pytest>=9", "pytest-asyncio>=1.0", "aiohttp==3.14.5", "uvicorn>=0.34.0", "fastapi>=0.115"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
